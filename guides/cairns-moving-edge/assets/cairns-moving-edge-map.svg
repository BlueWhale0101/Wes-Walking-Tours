<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Cairns Moving Edge walking route map</title>
  <desc id="desc">Walking route map from the Cairns Esplanade Lagoon to Trinity Inlet, showing the Esplanade, Abbott Street, Lake Street, Florence Street, Aplin Street, Shields Street, Spence Street, Wharf Street, Pier Point Road, and the numbered guide stops.</desc>
  <defs>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;fill:#253f38}
      .map-title{font-size:28px;font-weight:800}
      .note{font-size:16px;fill:#55675f}
      .street{font-size:20px;font-weight:800;fill:#4e5f57;letter-spacing:.2px}
      .minor-street{font-size:16px;font-weight:700;fill:#708078}
      .side-street{font-size:14px;font-weight:700;fill:#7a887f}
      .place{font-size:19px;font-weight:800;fill:#24483d}
      .water-label{font-size:25px;font-weight:800;fill:#2d6871}
      .callout{font-size:17px;font-weight:800;fill:#24483d}
      .tiny{font-size:13px;fill:#55675f}
      .stop-hint{font-size:15px;font-weight:800;fill:#24483d}
      .turn-hint{font-size:14px;font-weight:800;fill:#8d552d}
      .route-label{font-size:13px;font-weight:800;fill:#8d552d}
    </style>
    <pattern id="mudHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#a67d3f" stroke-width="3" opacity=".28"/>
    </pattern>
    <marker id="routeArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#24483d"/>
    </marker>
    <marker id="smallArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#8d552d"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#f5efe1"/>

  <!-- Simplified shoreline, mudflat, and inlet geography. -->
  <path d="M718 0 H1200 V840 H850 C882 775 911 700 903 626 C895 551 847 497 824 430 C796 347 841 266 819 184 C801 112 761 52 718 0 Z" fill="#b8dbe0"/>
  <path d="M640 0 C663 67 690 129 707 190 C725 255 708 312 713 370 C720 442 767 496 790 564 C821 653 796 755 759 840 H1012 C1038 758 1037 688 1016 626 C993 557 935 511 902 452 C868 391 869 323 879 256 C892 167 853 73 798 0 Z" fill="#d8c08c"/>
  <path d="M640 0 C663 67 690 129 707 190 C725 255 708 312 713 370 C720 442 767 496 790 564 C821 653 796 755 759 840 H1012 C1038 758 1037 688 1016 626 C993 557 935 511 902 452 C868 391 869 323 879 256 C892 167 853 73 798 0 Z" fill="url(#mudHatch)" opacity=".85"/>
  <path d="M768 840 C803 766 835 686 827 610 C819 535 773 485 748 414 C720 333 759 244 735 170 C713 102 683 48 646 0" fill="none" stroke="#6b987f" stroke-width="5" stroke-linecap="round"/>
  <path d="M1014 840 C1034 764 1037 698 1016 633 C993 562 934 516 901 456 C868 396 869 321 881 250 C894 164 857 74 803 0" fill="none" stroke="#86b2b1" stroke-width="3" opacity=".75"/>

  <!-- Esplanade parkland and waterfront walk. -->
  <path d="M94 739 C176 682 264 627 355 571 C457 508 558 438 690 345 C718 326 742 324 757 337 C773 351 766 374 734 399 C602 501 462 594 330 683 C258 731 186 779 110 817 Z" fill="#cbd8ad"/>
  <path d="M90 740 C183 674 287 610 397 545 C503 482 598 419 716 344" fill="none" stroke="#d4b967" stroke-width="24" stroke-linecap="round"/>
  <path d="M90 740 C183 674 287 610 397 545 C503 482 598 419 716 344" fill="none" stroke="#fff4cd" stroke-width="10" stroke-linecap="round"/>

  <!-- Named Cairns street grid. Big labels are deliberately readable on phone screens. -->
  <g stroke-linecap="round">
    <g stroke="#d5cdb8" stroke-width="9" opacity=".9">
      <path d="M52 650 L548 154"/>
      <path d="M111 724 L622 213"/>
      <path d="M180 781 L695 266"/>
      <path d="M258 824 L770 315"/>
      <path d="M342 836 L840 360"/>
      <path d="M20 658 L498 876"/>
      <path d="M88 589 L586 816"/>
      <path d="M165 522 L676 756"/>
      <path d="M247 459 L756 692"/>
      <path d="M330 396 L820 620"/>
      <path d="M426 337 L882 545"/>
    </g>
    <g stroke="#f7f0df" stroke-width="4" opacity=".95">
      <path d="M52 650 L548 154"/>
      <path d="M111 724 L622 213"/>
      <path d="M180 781 L695 266"/>
      <path d="M258 824 L770 315"/>
      <path d="M342 836 L840 360"/>
      <path d="M20 658 L498 876"/>
      <path d="M88 589 L586 816"/>
      <path d="M165 522 L676 756"/>
      <path d="M247 459 L756 692"/>
      <path d="M330 396 L820 620"/>
      <path d="M426 337 L882 545"/>
    </g>
    <g stroke="#c9bea6" stroke-width="14">
      <path d="M82 702 L595 190"/>
      <path d="M145 750 L660 235"/>
      <path d="M221 799 L733 288"/>
      <path d="M300 834 L805 332"/>
      <path d="M55 625 L515 834"/>
      <path d="M126 555 L610 776"/>
      <path d="M207 489 L704 716"/>
      <path d="M289 425 L784 652"/>
      <path d="M374 362 L836 573"/>
    </g>
    <g stroke="#efe6d3" stroke-width="7">
      <path d="M82 702 L595 190"/>
      <path d="M145 750 L660 235"/>
      <path d="M221 799 L733 288"/>
      <path d="M300 834 L805 332"/>
      <path d="M55 625 L515 834"/>
      <path d="M126 555 L610 776"/>
      <path d="M207 489 L704 716"/>
      <path d="M289 425 L784 652"/>
      <path d="M374 362 L836 573"/>
    </g>
  </g>

  <!-- Subtle intersection beads make the grid read as walkable streets, not abstract diagonals. -->
  <g fill="#efe6d3" stroke="#c5b99f" stroke-width="2" opacity=".88">
    <circle cx="207" cy="489" r="6"/>
    <circle cx="289" cy="425" r="6"/>
    <circle cx="374" cy="362" r="6"/>
    <circle cx="276" cy="605" r="6"/>
    <circle cx="396" cy="521" r="6"/>
    <circle cx="468" cy="353" r="6"/>
    <circle cx="396" cy="311" r="6"/>
    <circle cx="672" cy="260" r="6"/>
    <circle cx="734" cy="397" r="6"/>
    <circle cx="805" cy="332" r="6"/>
  </g>

  <!-- Important walking corridors. -->
  <g fill="none" stroke-linecap="round">
    <path d="M91 735 C187 670 292 606 397 545 C506 481 596 421 716 344" stroke="#fff7d7" stroke-width="18"/>
    <path d="M82 702 L595 190" stroke="#efe2c1" stroke-width="12"/>
    <path d="M145 750 L660 235" stroke="#efe2c1" stroke-width="12"/>
    <path d="M207 489 L704 716" stroke="#efe2c1" stroke-width="12"/>
    <path d="M289 425 L784 652" stroke="#efe2c1" stroke-width="12"/>
    <path d="M676 256 C718 264 760 258 793 233 C828 207 846 180 852 160" stroke="#fff7d7" stroke-width="14"/>
    <path d="M738 398 C788 349 824 302 858 238" stroke="#efe2c1" stroke-width="10"/>
    <path d="M588 418 C626 390 668 366 716 344" stroke="#efe2c1" stroke-width="10"/>
  </g>

  <!-- Route overlay, redrawn to pass through every numbered stop in order. -->
  <path d="M204 697 L276 605 L396 521 L576 412 L468 353 L396 311 L672 260 L852 160"
        fill="none" stroke="#f7df8a" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M204 697 L276 605 L396 521 L576 412 L468 353 L396 311 L672 260 L852 160"
        fill="none" stroke="#24483d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routeArrow)"/>
  <path d="M204 697 L276 605 L396 521 L576 412 L468 353 L396 311 L672 260 L852 160"
        fill="none" stroke="#fffdf3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M410 432 L482 386" fill="none" stroke="#8d552d" stroke-width="5" stroke-linecap="round" marker-end="url(#smallArrow)"/>
  <path d="M512 308 L622 274" fill="none" stroke="#8d552d" stroke-width="5" stroke-linecap="round" marker-end="url(#smallArrow)"/>

  <!-- Tiny turn notes are there for the exact moments walkers tend to hesitate. -->
  <g class="label">
    <rect x="422" y="448" width="250" height="48" rx="10" fill="#fffaf0" stroke="#d5c69f" stroke-width="2" opacity=".95"/>
    <text x="440" y="477" class="turn-hint">Leave foreshore at Shields St</text>
    <rect x="280" y="326" width="204" height="48" rx="10" fill="#fffaf0" stroke="#d5c69f" stroke-width="2" opacity=".95"/>
    <text x="298" y="355" class="turn-hint">Lake &amp; Shields cluster</text>
    <rect x="574" y="292" width="244" height="48" rx="10" fill="#fffaf0" stroke="#d5c69f" stroke-width="2" opacity=".95"/>
    <text x="592" y="321" class="turn-hint">Continue to Spence St pier</text>
  </g>

  <!-- Leader lines keep offset labels visually tied to their exact street/path segment. -->
  <g fill="none" stroke="#8d552d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6" opacity=".82">
    <path d="M590 403 L576 412"/>
    <path d="M486 373 L468 353"/>
    <path d="M320 309 L396 311"/>
    <path d="M690 252 L672 260"/>
    <path d="M870 170 L852 160"/>
  </g>

  <!-- Locator dots sit directly under the app's interactive marker buttons. -->
  <g fill="#f6d66e" stroke="#24483d" stroke-width="4">
    <circle cx="204" cy="697" r="18"/>
    <circle cx="276" cy="605" r="18"/>
    <circle cx="396" cy="521" r="18"/>
    <circle cx="576" cy="412" r="18"/>
    <circle cx="468" cy="353" r="18"/>
    <circle cx="396" cy="311" r="18"/>
    <circle cx="672" cy="260" r="18"/>
    <circle cx="852" cy="160" r="18"/>
  </g>

  <!-- Navigation-first labels. -->
  <g class="label">
    <text x="42" y="48" class="map-title">Walking map: Lagoon to Trinity Inlet</text>
    <text x="43" y="76" class="note">Follow the Esplanade, detour inland at Shields/Lake, then return toward the reef terminal.</text>

    <text x="354" y="602" class="street" transform="rotate(-32 354 602)">Cairns Esplanade</text>
    <text x="120" y="708" class="side-street" transform="rotate(-33 120 708)">Lagoon / foreshore path</text>
    <text x="236" y="455" class="street" transform="rotate(-45 236 455)">Abbott St</text>
    <text x="292" y="676" class="street" transform="rotate(-45 292 676)">Lake St</text>
    <text x="348" y="782" class="side-street" transform="rotate(-45 348 782)">Grafton St</text>
    <text x="426" y="814" class="side-street" transform="rotate(-45 426 814)">Sheridan St</text>
    <text x="492" y="720" class="street" transform="rotate(25 492 720)">Aplin St</text>
    <text x="532" y="648" class="street" transform="rotate(25 532 648)">Shields St</text>
    <text x="608" y="587" class="street" transform="rotate(25 608 587)">Spence St</text>
    <text x="705" y="474" class="street" transform="rotate(25 705 474)">Wharf St</text>
    <text x="168" y="560" class="side-street" transform="rotate(25 168 560)">Florence St</text>
    <text x="232" y="504" class="side-street" transform="rotate(25 232 504)">Aplin St</text>
    <text x="344" y="442" class="side-street" transform="rotate(25 344 442)">Shields St</text>
    <text x="438" y="388" class="side-street" transform="rotate(25 438 388)">Spence St</text>
    <text x="756" y="305" class="minor-street" transform="rotate(-38 756 305)">Pier Point Rd</text>
    <text x="783" y="238" class="side-street" transform="rotate(-48 783 238)">Reef terminal path</text>

    <text x="216" y="578" class="route-label">stay on waterfront</text>
    <text x="542" y="385" class="route-label">turn inland</text>
    <text x="430" y="326" class="route-label">heritage stops on Shields</text>
    <text x="690" y="288" class="route-label">toward Wharf / terminal</text>

    <text x="76" y="672" class="place">Start: Lagoon</text>
    <text x="314" y="492" class="place">Esplanade path</text>
    <text x="584" y="455" class="place">Court House Gallery</text>
    <text x="264" y="270" class="place">Museum / Hides Hotel</text>
    <text x="640" y="218" class="place">Reef Fleet Terminal</text>

    <text x="222" y="733" class="stop-hint">1 Lagoon</text>
    <text x="294" y="642" class="stop-hint">2 Mudflat view</text>
    <text x="414" y="548" class="stop-hint">3 Esplanade</text>
    <text x="594" y="399" class="stop-hint">4 Abbott &amp; Shields</text>
    <text x="486" y="381" class="stop-hint">5 Museum</text>
    <text x="300" y="302" class="stop-hint">6 Hides corner</text>
    <text x="690" y="251" class="stop-hint">7 Terminal walk</text>
    <text x="870" y="172" class="stop-hint">8 Inlet</text>

    <text x="842" y="86" class="water-label">Trinity Bay</text>
    <text x="838" y="116" class="note">tidal flat at low tide</text>
    <text x="899" y="741" class="water-label">Trinity Inlet</text>
    <text x="899" y="771" class="note">port, mangroves, reef fleet</text>

    <rect x="54" y="104" width="310" height="104" rx="14" fill="#fffaf0" stroke="#c4b891" stroke-width="2" opacity=".95"/>
    <text x="76" y="135" class="callout">Simple navigation</text>
    <text x="76" y="164" class="note">1-3 waterfront path</text>
    <text x="76" y="190" class="note">4-6 heritage core loop</text>
    <text x="234" y="164" class="note">7-8 inlet finish</text>
  </g>

  <!-- Legend, tucked away from the active stop marker. -->
  <g transform="translate(804 28)">
    <rect x="0" y="0" width="350" height="88" rx="14" fill="#fffaf0" opacity=".93" stroke="#c4b891" stroke-width="2"/>
    <line x1="22" y1="30" x2="94" y2="30" stroke="#24483d" stroke-width="9" stroke-linecap="round"/>
    <text x="110" y="36" class="label tiny">Walking route, in stop order</text>
    <rect x="22" y="56" width="72" height="14" fill="#d8c08c"/>
    <text x="110" y="70" class="label tiny">Tidal flat / mangrove edge</text>
  </g>

  <text x="42" y="816" class="label tiny">Authored schematic for field navigation. Base geography derived from OpenStreetMap; map data © OpenStreetMap contributors.</text>
</svg>
