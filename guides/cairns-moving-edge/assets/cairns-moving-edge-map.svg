<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Cairns Moving Edge walking route map</title>
  <desc id="desc">Authored walking route map from the Cairns Esplanade Lagoon along the waterfront, through the heritage core, and to Trinity Inlet.</desc>
  <defs>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;fill:#24413b}
      .small{font-size:18px}
      .tiny{font-size:14px}
      .water-label{font-size:22px;font-weight:700;fill:#2e6470}
      .place{font-size:20px;font-weight:700}
      .street{font-size:14px;fill:#6f7f76;letter-spacing:.2px}
    </style>
    <pattern id="mudHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#b38c4f" stroke-width="3" opacity=".32"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#29584f"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#f4efe2"/>

  <!-- Water, tidal flats, and working inlet. The base is intentionally simplified from OSM-style geography. -->
  <path d="M730 0 H1200 V840 H856 C899 752 929 661 915 575 C904 506 861 456 842 394 C817 312 860 227 832 145 C814 91 772 45 730 0 Z" fill="#b7d8dd"/>
  <path d="M654 0 C675 74 699 133 717 184 C738 244 721 296 716 346 C709 414 759 465 787 525 C828 611 807 724 770 840 H1030 C1044 780 1044 720 1024 665 C998 593 942 548 907 489 C874 432 869 368 879 301 C890 222 879 140 842 73 C827 45 807 20 786 0 Z" fill="#d8c08c"/>
  <path d="M654 0 C675 74 699 133 717 184 C738 244 721 296 716 346 C709 414 759 465 787 525 C828 611 807 724 770 840 H1030 C1044 780 1044 720 1024 665 C998 593 942 548 907 489 C874 432 869 368 879 301 C890 222 879 140 842 73 C827 45 807 20 786 0 Z" fill="url(#mudHatch)" opacity=".75"/>
  <path d="M779 840 C820 760 854 676 844 592 C834 516 785 471 764 407 C738 329 780 244 754 170 C731 106 690 54 646 0" fill="none" stroke="#6f927d" stroke-width="5" stroke-linecap="round"/>
  <path d="M1008 840 C1032 766 1037 701 1018 642 C994 569 933 526 900 465 C866 402 871 323 882 252 C895 169 868 82 812 0" fill="none" stroke="#8fb3b1" stroke-width="3" opacity=".8"/>

  <!-- Park and city fabric. -->
  <path d="M110 710 C202 648 297 592 393 535 C499 472 586 415 692 340 C713 326 730 323 746 331 C758 337 763 350 756 362 C739 395 692 420 641 455 C545 519 448 584 350 649 C278 697 206 745 132 790 Z" fill="#cbd7ab" opacity=".95"/>
  <path d="M92 736 C188 670 290 611 397 548 C506 483 596 424 704 348" fill="none" stroke="#d7c27f" stroke-width="22" stroke-linecap="round"/>
  <path d="M92 736 C188 670 290 611 397 548 C506 483 596 424 704 348" fill="none" stroke="#fff3cd" stroke-width="10" stroke-linecap="round"/>

  <g stroke="#d2c8b0" stroke-width="8" stroke-linecap="round">
    <path d="M146 704 L576 252"/>
    <path d="M218 740 L655 300"/>
    <path d="M294 780 L727 350"/>
    <path d="M80 640 L470 815"/>
    <path d="M150 579 L550 760"/>
    <path d="M230 515 L632 696"/>
    <path d="M318 460 L731 646"/>
    <path d="M410 395 L782 564"/>
  </g>
  <g stroke="#ebe3d2" stroke-width="4" stroke-linecap="round">
    <path d="M146 704 L576 252"/>
    <path d="M218 740 L655 300"/>
    <path d="M294 780 L727 350"/>
    <path d="M80 640 L470 815"/>
    <path d="M150 579 L550 760"/>
    <path d="M230 515 L632 696"/>
    <path d="M318 460 L731 646"/>
    <path d="M410 395 L782 564"/>
  </g>

  <!-- Route overlay. Stops themselves are rendered interactively by the app. -->
  <path d="M204 697 C252 650 279 613 320 574 C360 538 407 510 456 475 C516 432 570 394 646 355 C670 341 699 327 740 305 C775 287 817 244 850 187 C869 153 877 127 890 96"
        fill="none" stroke="#f8e6a0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M204 697 C252 650 279 613 320 574 C360 538 407 510 456 475 C516 432 570 394 646 355 C670 341 699 327 740 305 C775 287 817 244 850 187 C869 153 877 127 890 96"
        fill="none" stroke="#29584f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M204 697 C252 650 279 613 320 574 C360 538 407 510 456 475 C516 432 570 394 646 355 C670 341 699 327 740 305 C775 287 817 244 850 187 C869 153 877 127 890 96"
        fill="none" stroke="#fffdf2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <!-- Locator dots sit under the app's numbered marker buttons. -->
  <g fill="#f6d66e" stroke="#29584f" stroke-width="4">
    <circle cx="204" cy="697" r="18"/>
    <circle cx="276" cy="605" r="18"/>
    <circle cx="396" cy="521" r="18"/>
    <circle cx="576" cy="412" r="18"/>
    <circle cx="468" cy="353" r="18"/>
    <circle cx="396" cy="311" r="18"/>
    <circle cx="672" cy="260" r="18"/>
    <circle cx="852" cy="160" r="18"/>
  </g>

  <!-- Labels and context. -->
  <g class="label">
    <text x="48" y="62" font-size="36" font-weight="700">Cairns: The City Built on a Moving Edge</text>
    <text x="50" y="96" class="small">Audio guide route: Lagoon to Trinity Inlet</text>

    <text x="858" y="98" class="water-label">Trinity Bay</text>
    <text x="856" y="128" class="small" fill="#4c7477">mudflat edge at low tide</text>
    <text x="908" y="755" class="water-label">Trinity Inlet</text>
    <text x="906" y="786" class="small" fill="#4c7477">port, mangroves, reef fleet</text>

    <text x="138" y="628" class="place">Esplanade Lagoon</text>
    <text x="363" y="622" class="street" transform="rotate(-32 363 622)">Cairns Esplanade</text>
    <text x="512" y="480" class="place">Court House / Gallery</text>
    <text x="344" y="282" class="place">Heritage Core</text>
    <text x="640" y="235" class="place">Reef Fleet Terminal</text>
    <text x="742" y="441" class="street" transform="rotate(25 742 441)">Wharf Street</text>
    <text x="304" y="734" class="street" transform="rotate(-46 304 734)">Aplin Street</text>
    <text x="492" y="715" class="street" transform="rotate(25 492 715)">Lake Street</text>
    <text x="585" y="642" class="street" transform="rotate(25 585 642)">Grafton Street</text>
  </g>

  <!-- Small layover context inset. -->
  <g transform="translate(56 638)">
    <rect x="0" y="0" width="274" height="150" rx="16" fill="#fffaf0" stroke="#c4b891" stroke-width="3"/>
    <text x="18" y="34" class="label small" font-weight="700">Layover context</text>
    <path d="M34 108 C88 78 140 56 214 40" fill="none" stroke="#90b9c2" stroke-width="18" stroke-linecap="round"/>
    <path d="M34 108 C88 78 140 56 214 40" fill="none" stroke="#29584f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="34" cy="108" r="8" fill="#f6d66e" stroke="#29584f" stroke-width="3"/>
    <circle cx="214" cy="40" r="8" fill="#f6d66e" stroke="#29584f" stroke-width="3"/>
    <text x="24" y="132" class="label tiny">Cairns Airport</text>
    <text x="156" y="68" class="label tiny">CBD / Esplanade</text>
  </g>

  <g transform="translate(804 28)">
    <rect x="0" y="0" width="348" height="82" rx="14" fill="#fffaf0" opacity=".92" stroke="#c4b891" stroke-width="2"/>
    <line x1="22" y1="28" x2="94" y2="28" stroke="#29584f" stroke-width="8" stroke-linecap="round"/>
    <text x="110" y="34" class="label tiny">Walking route</text>
    <rect x="22" y="50" width="72" height="14" fill="#d8c08c"/>
    <text x="110" y="64" class="label tiny">Tidal flat / mangrove edge</text>
  </g>

  <text x="50" y="816" class="label tiny">Authored schematic map for field use. Base geography derived from OpenStreetMap; map data © OpenStreetMap contributors.</text>
</svg>
